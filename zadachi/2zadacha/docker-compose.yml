# Aligned with tasks/22.04-broker/docker-compose (images may use local cache: rabbitmq:3-management, redis:7.2-alpine)

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: broker-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      # avoid Docker Desktop / Windows permission issues on /var/lib/rabbitmq
      RABBITMQ_ERLANG_COOKIE: "BENCHMARK_LOCAL_COOKIE_01"
    tmpfs:
      - /var/lib/rabbitmq
    # 512m can OOM under 10k msg/s + management; raise for stable local runs
    mem_limit: 1024m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: broker-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --save ""
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
